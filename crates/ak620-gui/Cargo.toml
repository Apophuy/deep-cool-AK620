[package]
name = "ak620-gui"
description = "KDE Wayland settings and tray client for ak620d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ak620-control"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ksni = { version = "=0.3.3", features = ["blocking"] }
tokio = { version = "=1.53.1", features = ["net", "rt", "time"] }
zbus = "=5.11.0"
# Keep generated D-Bus code compatible with the MSRV-pinned zbus release.
zbus_macros = "=5.11.0"

[lints]
workspace = true
